projects:
  core:
    name: AI Engineering Core
    root: ./..
    aliases:
      - core
      - ai-core
      - ai-engineering-core

  comfyui:
    name: ComfyUI
    root: F:/try/ComfyUI
    aliases:
      - comfyui
      - ComfyUI
      - comfy
      - 绘图工作流
      - 工作流
    commands:
      test: .venv/Scripts/python.exe main.py --quick-test-for-ci --disable-manager

  demo:
    name: Demo Project
    root: ./..
    aliases:
      - demo
      - 示例项目

  bi:
    name: BI Platform
    root: ../bi
    aliases:
      - bi
      - BI
      - BI平台
      - 数据可视化
